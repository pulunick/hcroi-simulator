<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!--
			화면 테마를 첫 렌더 전에 확정한다 (라이트 → 다크 깜빡임 방지).
			작업공간 본문(hcroi:workspace:v1)은 큰 JSON 이라 여기서 파싱하지 않고,
			테마만 담은 작은 키를 따로 읽는다. 'system' 이거나 값이 없으면 속성을 두지 않고
			prefers-color-scheme 에 맡긴다.
		-->
		<script>
			try {
				var t = localStorage.getItem('hcroi:theme');
				if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
			} catch (e) {
				/* 프라이빗 모드 등 저장소 접근 불가 — 기기 설정을 따른다 */
			}
		</script>
		<!--
			페이지 제목에 회사 이름이 들어가므로 방문 통계에는 제목을 보내지 않는다.
			유마미(Umami) 스크립트 태그의 data-before-send 가 이 함수 이름을 가리킨다.
		-->
		<script>
			function hcroiAnalyticsBeforeSend(type, payload) {
				return Object.assign({}, payload, { title: '' });
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
